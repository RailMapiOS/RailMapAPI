# Docker Compose file for Vapor
#
# Install Docker on your system to run and test
# your Vapor app in a production-like environment.
#
# Note: This file is intended for testing and does not
# implement best practices for a production deployment.
#
# Learn more: https://docs.docker.com/compose/reference/
#
#   Build images: docker-compose build
#      Start app: docker-compose up app
#       Stop all: docker-compose down
#
x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  # `:?` makes Compose fail fast if the var is missing — better than silently
  # starting an unauthenticated server.
  API_AUTH_TOKENS: ${API_AUTH_TOKENS:?API_AUTH_TOKENS must be set in .env}

services:
  app:
    image: rail-map-a-p-i:latest
    build:
      context: .
    env_file:
      - .env
    environment:
      <<: *shared_environment
    restart: unless-stopped
    # Host networking instead of a published port. On the target Raspberry Pi,
    # freshly created Docker bridge networks do not pass traffic: the veth pair
    # comes up on both ends, but the container's eth0 records 0 bytes received
    # and the host never resolves ARP for the container IP. Pre-existing bridges
    # work, new ones do not. Host networking removes the bridge from the path.
    #
    # The app binds to the host loopback directly, so it stays unreachable from
    # the LAN and the internet — cloudflared, running on the host, is the only
    # client. Port 8090 because 8080 is taken by Zigbee2MQTT on that Pi.
    network_mode: host
    # user: '0' # uncomment to run as root for testing purposes even though Dockerfile defines 'vapor' user.
    command: ["serve", "--env", "production", "--hostname", "127.0.0.1", "--port", "8090"]
